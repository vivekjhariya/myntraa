kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: my-cluster

networking:
  disableDefaultCNI: false

nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
    labels:
      ingress-ready: "true"
      node-type: "control-plane"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "0.0.0.0"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "0.0.0.0"
        protocol: TCP
      - containerPort: 3001
        hostPort: 3001
        listenAddress: "0.0.0.0"
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true,node-type=control-plane"

  - role: worker
    image: kindest/node:v1.37.0
    labels:
      node-type: "general"
      workload: "general"

  - role: worker
    image: kindest/node:v1.37.0
    labels:
      node-type: "general"
      workload: "general"

  - role: worker
    image: kindest/node:v1.37.0
    labels:
      node-type: "spot"
      workload: "spot"

  - role: worker
    image: kindest/node:v1.37.0
    labels:
      node-type: "spot"
      workload: "spot"   
