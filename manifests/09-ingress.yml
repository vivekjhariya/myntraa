apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mytraa-ing
  namespace: mytraa-ns
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /mytraa
        pathType: Prefix
        backend:
          service:
            name: mytraa-svc
            port:
              number: 80
